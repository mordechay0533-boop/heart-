```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לב תלת-ממד</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle, #220000 0%, #000000 100%); 
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <script>
        let scene, camera, renderer, heart;
        let targetRotationX = 0, targetRotationY = 0;
        let isDragging = false;
        let previousMouseX = 0, previousMouseY = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5; // הרחקתי מעט את המצלמה

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.PointLight(0xff0044, 2.5);
            mainLight.position.set(5, 5, 5);
            scene.add(mainLight);

            const sideLight = new THREE.PointLight(0xffffff, 0.6);
            sideLight.position.set(-5, 2, 5);
            scene.add(sideLight);

            // Create Heart Shape
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo( x + 0.5, y + 0.5 );
            heartShape.bezierCurveTo( x + 0.5, y + 0.5, x + 0.4, y, x, y );
            heartShape.bezierCurveTo( x - 0.6, y, x - 0.6, y + 0.7,x - 0.6, y + 0.7 );
            heartShape.bezierCurveTo( x - 0.6, y + 1.1, x - 0.3, y + 1.54, x + 0.5, y + 1.9 );
            heartShape.bezierCurveTo( x + 1.2, y + 1.54, x + 1.6, y + 1.1, x + 1.6, y + 0.7 );
            heartShape.bezierCurveTo( x + 1.6, y + 0.7, x + 1.6, y, x + 1.0, y );
            heartShape.bezierCurveTo( x + 0.7, y, x + 0.5, y + 0.5, x + 0.5, y + 0.5 );

            const extrudeSettings = {
                depth: 0.4,
                bevelEnabled: true,
                bevelSegments: 20,
                steps: 2,
                bevelSize: 0.1,
                bevelThickness: 0.1
            };

            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshPhongMaterial({
                color: 0xff0022,
                shininess: 100,
                specular: 0x333333
            });

            heart = new THREE.Mesh(geometry, material);
            heart.rotation.x = Math.PI;
            // גודל מאוזן - לא גדול מדי ולא קטן מדי
            heart.scale.set(1.2, 1.2, 1.2);
            scene.add(heart);

            window.addEventListener('resize', onWindowResize, false);
            
            // Mouse events
            document.addEventListener('mousedown', () => isDragging = true);
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', onMouseMove);

            // Touch events
            document.addEventListener('touchstart', (e) => {
                isDragging = true;
                previousMouseX = e.touches[0].clientX;
                previousMouseY = e.touches[0].clientY;
            });
            document.addEventListener('touchend', () => isDragging = false);
            document.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    const deltaX = e.touches[0].clientX - previousMouseX;
                    const deltaY = e.touches[0].clientY - previousMouseY;
                    targetRotationY += deltaX * 0.01;
                    targetRotationX += deltaY * 0.01;
                    previousMouseX = e.touches[0].clientX;
                    previousMouseY = e.touches[0].clientY;
                }
            });

            animate();
        }

        function onMouseMove(event) {
            if (isDragging) {
                const deltaX = event.clientX - previousMouseX;
                const deltaY = event.clientY - previousMouseY;
                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;
            }
            previousMouseX = event.clientX;
            previousMouseY = event.clientY;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            heart.rotation.y += (targetRotationY - heart.rotation.y) * 0.05;
            heart.rotation.x += (targetRotationX + Math.PI - heart.rotation.x) * 0.05;

            if (!isDragging) {
                targetRotationY += 0.005;
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
